name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org # points npm at the registry, independent of how it authenticates
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
      # trusted publishing needs npm >= 11.5.1; node 24 ships 11.x but the exact patch drifts
      - run: npm install -g npm@latest
      # No NODE_AUTH_TOKEN: a trusted publisher registered for this repo and workflow on npmjs.com exchanges
      # the OIDC token above for publish rights, and provenance comes with it. Register it once with
      #   npm trust github react-oauth-oidc --file publish.yml --repo Fl0r14n/react-oauth --allow-publish
      # npm, not bun: bun publish cannot do trusted publishing or provenance.
      - run: npm publish --access public
        working-directory: apps/lib
